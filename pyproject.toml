[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memengine"
version = "2.0.0"
description = "Zero-dependency agent memory: SQLite + FTS5 banks, observation-first recall, secret-filtering quality gate"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "brebros" }]
requires-python = ">=3.10"
keywords = ["agent", "memory", "sqlite", "fts5", "llm", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
mem = "memengine.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
